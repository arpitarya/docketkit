[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docketkit"
dynamic = ["version"]           # one source: docketkit.__version__ (src/docketkit/__init__.py)
description = "Lands AI-agent changes into main one at a time, without ever losing work."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arpit Arya" }]
requires-python = ">=3.9"
dependencies = []               # SR-LAW-4: the standard library alone
keywords = ["git", "merge-queue", "ai-agents", "worktree", "claude-code"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/arpitarya/docketkit"
Changelog = "https://github.com/arpitarya/docketkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/arpitarya/docketkit/issues"

[project.scripts]
docketkit = "docketkit.cli:main"
dk = "docketkit.cli:main"

[tool.setuptools]
# kit/ ships inside the package as docketkit/kit, so `docketkit install`
# works from a pip install (SR-ARCHITECTURE decision 15).
package-dir = { "" = "src", "docketkit.kit" = "kit" }
# Every kit/ directory is listed; tests/test_packaging.py fails when one is not.
packages = [
  "docketkit",
  "docketkit.kit",
  "docketkit.kit.claude",
  "docketkit.kit.claude.hooks",
  "docketkit.kit.claude.skills",
  "docketkit.kit.claude.skills.inbox-review",
  "docketkit.kit.claude.skills.landing",
  "docketkit.kit.work",
  "docketkit.kit.scaffold",
  "docketkit.kit.scaffold._archive",
  "docketkit.kit.scaffold.docs",
  "docketkit.kit.scaffold.records",
  "docketkit.kit.scaffold.scripts",
  "docketkit.kit.scaffold.work",
  "docketkit.kit.scaffold.work.compare",
  "docketkit.kit.scaffold.work.open",
  "docketkit.kit.scaffold.work.proposals",
]

[tool.setuptools.package-data]
"docketkit.kit" = ["*"]
"docketkit.kit.claude" = ["*"]
"docketkit.kit.claude.hooks" = ["*"]
"docketkit.kit.claude.skills" = ["*"]
"docketkit.kit.claude.skills.inbox-review" = ["*"]
"docketkit.kit.claude.skills.landing" = ["*"]
"docketkit.kit.work" = ["*"]
"docketkit.kit.scaffold" = ["*"]
"docketkit.kit.scaffold._archive" = ["*"]
"docketkit.kit.scaffold.docs" = ["*"]
"docketkit.kit.scaffold.records" = ["*"]
"docketkit.kit.scaffold.scripts" = ["*"]
"docketkit.kit.scaffold.work" = ["*"]
"docketkit.kit.scaffold.work.compare" = ["*"]
"docketkit.kit.scaffold.work.open" = ["*"]
"docketkit.kit.scaffold.work.proposals" = ["*"]

[tool.setuptools.exclude-package-data]
"*" = [".DS_Store", "*.pyc"]

[tool.setuptools.dynamic]
version = { attr = "docketkit.__version__" }
